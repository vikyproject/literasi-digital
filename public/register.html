<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Literasi AI</title>
    <link rel="stylesheet" href="src/css/register.css" />
  </head>
  <body>
    <div class="register-container">
      <div class="register-header">
        <div class="register-logo">AI</div>
        <h1 class="register-title">Buat Akun</h1>
        <p class="register-subtitle">
          Gabung sekarang untuk mendapatkan akses ke pembelajaran AI interaktif.
        </p>
      </div>

      <form id="registerForm">
        <label>
          Username
          <input
            type="text"
            id="username"
            placeholder="Masukkan username"
            required
          />
        </label>
        <label>
          Password
          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
          />
        </label>
        <button type="submit">Daftar Sekarang</button>
      </form>

      <div class="login-link">
        Sudah punya akun? <a href="index.html">Login di sini</a>
      </div>
    </div>

    <script src="src/js/register.js"></script>
  </body>
</html>
