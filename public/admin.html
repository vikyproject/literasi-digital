<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Panel Admin</title>
    <link rel="stylesheet" href="src/css/admin.css" />
  </head>
  <body>
    <div class="page">
      <div class="header">
        <div class="title-group">
          <h1>Panel Admin</h1>
          <p>
            Kelola pengguna dan tambahkan modul pembelajaran langsung dari satu
            halaman.
          </p>
        </div>
        <div class="header-actions">
          <button id="logoutButton" class="btn-back">Logout</button>
        </div>
      </div>

      <div class="tab-nav">
        <button type="button" class="tab-button active" data-tab="usersTab">
          Kelola User
        </button>
        <button type="button" class="tab-button" data-tab="modulesTab">
          Tambah Modul
        </button>
      </div>

      <div class="grid">
        <section class="panel tab-panel active" id="usersTab">
          <div class="panel-header">
            <h2>Kelola Pengguna</h2>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Username</th>
                  <th>Role</th>
                  <th>Tindakan</th>
                </tr>
              </thead>
              <tbody id="userData"></tbody>
            </table>
          </div>
          <p class="message" id="userMessage"></p>
        </section>

        <section class="panel module-section tab-panel" id="modulesTab">
          <div>
            <h2>Tambah Modul</h2>
            <p>Tambahkan materi baru yang akan muncul di halaman modul.</p>
          </div>
          <form id="moduleForm" class="module-form">
            <div class="form-group">
              <label for="moduleTitle">Judul Modul</label>
              <input
                id="moduleTitle"
                class="module-input"
                type="text"
                required
                placeholder="Judul modul"
              />
            </div>
            <div class="form-group">
              <label for="moduleDescription">Deskripsi Modul</label>
              <textarea
                id="moduleDescription"
                class="module-textarea"
                required
                placeholder="Deskripsi singkat modul"
              ></textarea>
            </div>
            <div class="form-group">
              <label for="moduleImage">Link Gambar</label>
              <input
                id="moduleImage"
                class="module-input"
                type="url"
                placeholder="https://..."
              />
            </div>
            <div class="form-group">
              <label for="moduleUrl">Link Modul</label>
              <input
                id="moduleUrl"
                class="module-input"
                type="url"
                placeholder="https://..."
              />
            </div>
            <button type="submit" class="module-submit">Simpan Modul</button>
          </form>
          <p class="message" id="moduleMessage"></p>
          <div>
            <h3>Modul Terbaru</h3>
            <div id="moduleCards" class="module-cards"></div>
          </div>
        </section>
      </div>
    </div>

    <div id="popupDialog" class="popup-dialog hidden" aria-hidden="true">
      <div class="popup-backdrop"></div>
      <div
        class="popup-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="popupTitle"
        aria-describedby="popupMessage"
      >
        <button
          id="popupClose"
          class="popup-close"
          type="button"
          aria-label="Tutup popup"
        >
          ×
        </button>
        <div class="popup-icon">⚠️</div>
        <h2 id="popupTitle">Perhatian</h2>
        <p id="popupMessage">Apakah Anda yakin ingin melanjutkan aksi ini?</p>
        <div class="popup-actions">
          <button
            id="popupCancel"
            type="button"
            class="popup-button popup-cancel"
          >
            Batal
          </button>
          <button
            id="popupConfirm"
            type="button"
            class="popup-button popup-confirm"
          >
            Konfirmasi
          </button>
        </div>
      </div>
      <div id="logoutOverlay" class="logout-overlay"></div>
    </div>
    <script src="src/js/admin.js"></script>
  </body>
</html>
