<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Literasi AI</title>
    <link rel="stylesheet" href="src/css/index.css" />
  </head>
  <body>
    <div class="login-box">
      <div class="login-header">
        <div class="login-logo">AI</div>
        <h1 class="login-title">Literasi AI</h1>
        <p class="login-subtitle">
          Masuk untuk melanjutkan ke dashboard pembelajaran cerdas.
        </p>
      </div>

      <form id="loginForm">
        <label>
          Username
          <input
            type="text"
            id="username"
            placeholder="Masukkan username"
            required
          />
        </label>
        <label>
          Password
          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
          />
        </label>
        <button type="submit">Masuk</button>
      </form>

      <div class="register-link">
        Belum punya akun? <a href="register.html">Daftar sekarang</a>
      </div>
      <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>
    </div>

    <script src="src/js/index.js"></script>
  </body>
</html>
